<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Unique Analytics Africa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b2b21">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #0b2b21; color: #cfe1d7; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 1.0625rem; line-height: 1.6; }
  main { max-width: 32rem; }
  p.name { margin: 0 0 2rem; font-weight: 650; color: #ffffff; }
  h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; letter-spacing: -.02em; color: #ffffff; }
  p { margin: 1rem 0 0; }
  a.btn { display: inline-flex; align-items: center; min-height: 3rem; margin-top: 2rem; padding: .75rem 1.4rem; border-radius: 8px; background: #8fe0b0; color: #0b2b21; font-weight: 600; text-decoration: none; }
  a.btn:hover { background: #b9efcf; }
  a.btn:focus-visible { outline: 2px solid #8fe0b0; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="name">Unique Analytics Africa</p>
  <h1>This page doesn’t exist.</h1>
  <p>The link may be old or mistyped. Everything on the site is on the home page.</p>
  <a class="btn" id="home" href="/">Go to the home page</a>
</main>
<script>
  // On the free github.io address the site lives in a sub-folder; on a custom domain it lives at the root.
  if (/\.github\.io$/.test(location.hostname)) {
    var first = location.pathname.split('/')[1];
    if (first) document.getElementById('home').href = '/' + first + '/';
  }
</script>
</body>
</html>
